name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q

  build:
    needs: test
    permissions:
      contents: write   # attach binaries to the Release on a tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: TripleTriad-linux-x86_64
          - os: windows-latest
            asset: TripleTriad-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --clean --noconfirm TripleTriad.spec

      - name: smoke test
        shell: bash
        run: |
          BIN=dist/TripleTriad
          [ "$RUNNER_OS" = "Windows" ] && BIN=dist/TripleTriad.exe
          "$BIN" difficulty --limit 1

      - name: package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.asset }}.zip" TripleTriad.exe
          else
            chmod +x TripleTriad
            zip "../${{ matrix.asset }}.zip" TripleTriad
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}.zip
